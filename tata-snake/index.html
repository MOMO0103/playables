  state={x:164,target:164,t:0,gate:85,fire:0,headDistance:287,bossHp:bossMax,bottle:bottleMax,
    released:false,releaseT:0,freezeT:0,recoil:0,power:8,lanes:1,tiles,shots:[],sparks:[],words:[],segments:[],
    shotN:0,kills:0,shake:0,msgTime:0,headFlash:0,jarFlash:0};
  state.segments=Array.from({length:30},(_,i)=>({hp:i<3?[24,32,40][i]:Math.min(1536,48*2**Math.floor(i/4)),flash:0,lag:0}));
}
function ui(){
  el('power').textContent=state.power;el('lanes').textContent=state.lanes;
  el('bossHp').textContent=Math.max(0,Math.ceil(state.bossHp));
  el('bossBar').style.width=(100*state.bossHp/bossMax)+'%';
}
function report(msg,seconds=2){el('tip').textContent=msg;state.msgTime=seconds}
function ring(hz,duration,volume=.025){
  if(!soundOn||!audio||audio.state!=='running')return;
  const osc=audio.createOscillator(),gain=audio.createGain();osc.type='sine';osc.frequency.setValueAtTime(hz,audio.currentTime);osc.frequency.exponentialRampToValueAtTime(hz*.52,audio.currentTime+duration);
  gain.gain.setValueAtTime(volume,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+duration);osc.connect(gain).connect(audio.destination);osc.start();osc.stop(audio.currentTime+duration);
}
function start(){
  newGame();mode='playing';acc=0;pointer=null;keyState.clear();el('veil').hidden=true;el('start').hidden=true;el('pause').hidden=false;report('蛇王冲锋！瞄准蛇身，打掉三节可打断冲锋',5);ui();
}
function panel(phase){
  if(mode!=='playing')return;
  mode=phase;pointer=null;keyState.clear();el('veil').hidden=false;el('pause').hidden=true;el('resume').hidden=phase!=='paused';
  el('result').textContent=phase==='paused'?'已暂停':phase==='won'?'镇蛇成功':'防线失守';
  el('detail').textContent=phase==='paused'?'塔塔正在等你。':phase==='won'?(state.released?'双塔塔击退了蛇王。':'塔塔击退了蛇王。'):'蛇王已抵达红线。击破强化石可以提升火力。';

el('start').onclick=start;el('restart').onclick=start;el('pause').onclick=()=>panel('paused');
el('resume').onclick=()=>{mode='playing';el('veil').hidden=true;el('pause').hidden=false;acc=0};
el('sound').onclick=()=>{soundOn=!soundOn;if(soundOn){audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume().then(()=>ring(590,.12)).catch(()=>{});}el('sound').textContent='音效 '+(soundOn?'开':'关')};
function aim(e){const r=canvas.getBoundingClientRect();state.target=clamp((e.clientX-r.left)*360/r.width,20,337)}
canvas.onpointerdown=e=>{if(mode==='ready'&&!el('start').disabled)start();if(mode!=='playing'||pointer!==null)return;pointer=e.pointerId;canvas.setPointerCapture(pointer);aim(e)};
canvas.onpointermove=e=>{if(mode==='playing'&&e.pointerId===pointer)aim(e)};
canvas.onpointerup=canvas.onpointercancel=()=>{pointer=null};
window.onkeydown=e=>{if(['ArrowLeft','ArrowRight','a','d','A','D'].includes(e.key)){e.preventDefault();if(mode==='playing')keyState.add(e.key.toLowerCase())}if(e.key==='Escape'&&!e.repeat){if(mode==='paused')el('resume').click();else panel('paused')}};
window.onkeyup=e=>keyState.delete(e.key.toLowerCase());document.onvisibilitychange=()=>{if(document.hidden)panel('paused')};
function pos(d){
  // A rounded turn connects the upper road to the exit lane.
  if(d<279)return {x:5+d,y:120,angle:Math.PI/2};
  if(d<329.27){const a=(d-279)/32;return {x:284+32*Math.sin(a),y:152-32*Math.cos(a),angle:Math.PI/2-a}}
  return {x:316,y:152+d-329.27,angle:0};
}
const linkPitch=29;
function linkDistance(index){return state.headDistance-36-index*linkPitch-state.segments[index].lag}
function linkPose(index){return pos(linkDistance(index))}
function advanceSnake(s,dt){
  if(s.recoil>0){
    const step=Math.min(s.recoil,135*dt);
    s.headDistance=Math.max(150,s.headDistance-step);s.recoil-=step;return;
  }
  if(s.freezeT>0)return;
  const rushSpeed=[32,27,22];
  s.headDistance+=(rushSpeed[s.kills]??(14.5+Math.min(4,s.t*.07)))*dt;
}
function burst(x,y,color,n=8){
  for(let i=0;i<n;i++){let angle=Math.random()*Math.PI*2,s=14+Math.random()*58;state.sparks.push({x,y,vx:Math.cos(angle)*s,vy:Math.sin(angle)*s,life:.18+Math.random()*.27,color})}
}
function word(x,y,text,color){state.words.push({x,y,text,color,life:.85})}
function projectile(x,y,damage,vx=0,ally=false){return {x,y,vx,damage,ally,gate:false,dead:false}}
function shoot(){
  const s=state;s.shotN++;for(let i=0;i<s.lanes;i++)s.shots.push(projectile(s.x+(i-(s.lanes-1)/2)*7,436,s.power));
  if(s.released&&s.releaseT<=0){const h=pos(s.headDistance),side=allyX();s.shots.push(projectile(side,426,Math.max(120,s.power*2),(h.x-side)*470/Math.max(28,426-h.y),true))}
  if(s.shotN%3===0)ring(s.released?650:520,.05,.012);
}
function allyX(){return state.x>185?state.x-34:state.x+34}
function releaseJar(){
  const s=state;s.bottle=0;s.released=true;s.releaseT=.85;s.freezeT=4;s.shake=3;burst(61,201,'#aefffb',36);word(65,198,'破封！','#bcffff');report('冰猫破瓶 · 蛇王冻结 4 秒',4);ring(1020,.4);
}
function hitTile(tile,b){
  const damage=tile.type==='stone'?Math.min(b.damage,tile.max/9):b.damage;
  tile.hp=Math.max(0,tile.hp-damage);if(tile.hp<.0001)tile.hp=0;
  tile.flash=.045;burst(b.x,b.y,tile.type==='stone'?'#ded6b8':'#fbde7d',3);
  if(tile.hp>0)return;
  if(tile.type==='power'){state.power*=2;word(tile.x+20,tile.y,'威力 ×2','#ffef94');report('强化石击破 · 弹丸威力翻倍')}
  if(tile.type==='multi'){state.lanes++;word(tile.x+20,tile.y,'弹道 +1','#9ef9ff');report('强化石击破 · 增加一条弹道')}
  burst(tile.x+20,tile.y+20,'#d0bc8e',8);if(tile.type!=='stone')ring(790,.15);ui();
}
function hitSnake(b){
  const s=state,head=pos(s.headDistance);
  if(Math.hypot(b.x-head.x,b.y-head.y)<25){s.bossHp=Math.max(0,s.bossHp-b.damage);s.headFlash=.08;burst(b.x,b.y,'#ffbc5b',4);ui();return true}
  if(b.ally)return false;
  for(let i=0;i<s.segments.length;i++){
    const p=linkPose(i);if(p.x < -28)break;
    if(Math.hypot(b.x-p.x,b.y-p.y)>19)continue;
    const seg=s.segments[i];seg.hp-=b.damage;seg.flash=.1;
    if(seg.hp<=0){
      s.segments.splice(i,1);s.kills++;s.recoil+=s.kills<=3?52:13;
      for(let j=i;j<s.segments.length;j++)s.segments[j].lag+=linkPitch;
      s.bossHp=Math.max(0,s.bossHp-90);burst(p.x,p.y,'#ffb751',13);
      if(s.kills<=3)report(s.kills===3?'冲锋已打断 · 趁机强化塔塔':'击退一节 · 再打掉 '+(3-s.kills)+' 节可打断冲锋',3);
      ui();
    }
    else burst(b.x,b.y,'#ffc771',3);return true;
  }return false;
}
function moveShot(b,dt){
  const s=state,oldY=b.y;b.y-=470*dt;b.x+=b.vx*dt;
  if(!b.ally&&oldY>392&&b.y<=392&&!b.gate&&Math.abs(b.x-s.gate)<36){
    b.gate=true;const copy=projectile(b.x+5,b.y,b.damage,5);copy.gate=true;s.shots.push(copy);b.vx=-5;burst(b.x,391,'#8fffe9',3);
  }
  if(!b.ally){
    const tile=s.tiles.find(t=>t.hp>0&&Math.abs(b.x-t.x-20)<20&&Math.abs(b.y-t.y-20)<20);
    if(tile){hitTile(tile,b);b.dead=true;return}
    if(!s.released&&b.x>25&&b.x<96&&b.y>165&&b.y<238){
      s.bottle=Math.max(0,s.bottle-b.damage*3);s.jarFlash=.11;burst(b.x,b.y,'#acfbff',3);if(!s.bottle)releaseJar();b.dead=true;return;
    }
  }
  b.dead=hitSnake(b)||b.y<72||b.x<0||b.x>360;
}
function tick(dt){
  const s=state;s.t+=dt;s.gate=145+103*Math.sin(s.t*1.36-.6);
  const axis=Number(keyState.has('arrowright')||keyState.has('d'))-Number(keyState.has('arrowleft')||keyState.has('a'));
  if(axis)s.target=clamp(s.target+axis*265*dt,20,337);
  s.x+=(s.target-s.x)*(1-Math.exp(-21*dt));s.fire-=dt;if(s.fire<=0){shoot();s.fire+=.13}
  if(s.freezeT>0)s.freezeT=Math.max(0,s.freezeT-dt);
  advanceSnake(s,dt);
  for(const seg of s.segments)seg.lag=Math.max(0,seg.lag-120*dt);
  s.releaseT=Math.max(0,s.releaseT-dt);
  const n=s.shots.length;for(let i=0;i<n;i++)moveShot(s.shots[i],dt);
  s.shots=s.shots.filter(b=>!b.dead);
  for(const p of s.sparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=65*dt;p.life-=dt}
  s.sparks=s.sparks.filter(p=>p.life>0);
  for(const w of s.words){w.y-=22*dt;w.life-=dt}s.words=s.words.filter(w=>w.life>0);
  for(const t of [...s.tiles,...s.segments])t.flash=Math.max(0,t.flash-dt);
  s.headFlash=Math.max(0,s.headFlash-dt);s.jarFlash=Math.max(0,s.jarFlash-dt);s.shake=Math.max(0,s.shake-dt*8);
  if(s.msgTime>0&&(s.msgTime-=dt)<=0)el('tip').textContent=guide;
  if(s.bossHp<=0)panel('won');else if(s.headDistance>=endDistance)panel('lost');
}
function rounded(x,y,w,h,r,fill,stroke,width=1){
  ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}
}
function label(text,x,y,size=12,color='#fff7e0',edge='#302622'){
  ctx.font='900 '+size+'px "Trebuchet MS","Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
  if(edge){ctx.lineWidth=size>14?3.4:2.4;ctx.strokeStyle=edge;ctx.strokeText(text,x,y)}
  ctx.fillStyle=color;ctx.fillText(text,x,y);
}
function line(x1,y1,x2,y2,color,width=1){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function ellipse(x,y,rx,ry,color){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}
function paintTile(t){
  if(t.hp<=0)return;const x=t.x+1,y=t.y+1;
  if(t.type==='stone'){
    const g=ctx.createLinearGradient(x,y,x+12,y+38);g.addColorStop(0,'#c1ccca');g.addColorStop(.15,'#aebbbd');g.addColorStop(1,'#8f9da0');
    rounded(x,y+2,38,37,6,'#705e43');rounded(x,y,38,36,[6,7,5,5],t.flash?'#eff8e8':g,'#53606a',1.4);
    line(x+5,y+3,x+27-t.variant,y+3,'#d9e1d26b');line(x+7,y+33,x+30,y+33,'#68777c6b',1.3);
    const wear=1-t.hp/t.max;
    if(wear>0){line(x+18,y,x+14,y+8,'#535d61',1.4);line(x+14,y+8,x+20,y+14,'#535d61',1.4)}
    if(wear>=.34){line(x+20,y+14,x+14,y+23,'#48575b',1.6);line(x+14,y+23,x+6,y+26,'#48575b',1.4)}
    if(wear>=.65){line(x+14,y+23,x+18,y+34,'#414e51',1.8);line(x+20,y+14,x+31,y+9,'#414e51',1.6)}
    if(wear>0){rounded(x+5,y+29,28,3,1,'#415050');rounded(x+5,y+29,Math.max(.5,28*(1-wear)),3,1,wear>.65?'#ffae73':'#b3e2ae')}
  }else{
    const cx=x+18,cy=y+19;ctx.beginPath();for(let i=0;i<6;i++){let a=(i/3-.5)*Math.PI;let xx=cx+18*Math.cos(a),yy=cy+18*Math.sin(a);i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.closePath();
    ctx.fillStyle=t.flash?'#fff5b3':t.type==='multi'?'#90a7aa':'#b5a991';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#5a594e';ctx.stroke();
    label(Math.ceil(t.hp),cx,cy-8,13);label(t.type==='multi'?'● +1':'● ↑',cx,cy+7,9,'#fff1c7','#706652');
  }
}
function paintBottle(){
  const s=state;if(s.released)return;
  const x=60,y=204;
  ellipse(x,236,33,4,'#372d3960');
  const g=ctx.createLinearGradient(28,0,92,0);g.addColorStop(0,'#416471e0');g.addColorStop(.18,'#d4ffffb0');g.addColorStop(.52,'#8bc3c745');g.addColorStop(.85,'#a7eaffad');g.addColorStop(1,'#47646bcf');
  ctx.beginPath();ctx.moveTo(44,171);ctx.lineTo(44,177);ctx.bezierCurveTo(43,182,27,182,27,198);ctx.lineTo(27,222);ctx.quadraticCurveTo(27,236,40,236);ctx.lineTo(80,236);ctx.quadraticCurveTo(93,236,93,222);ctx.lineTo(93,198);ctx.bezierCurveTo(93,182,77,182,76,177);ctx.lineTo(76,171);ctx.closePath();
  ctx.fillStyle=g;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#2d5966';ctx.stroke();ctx.save();ctx.clip();
  ellipse(60,222,28,11,'#71e9fc55');const bob=Math.sin(clock*2.6)*1.4;
  ctx.drawImage(sprites.ascended,x-24,y-22+bob,49,46);ctx.strokeStyle='#eeffffb5';ctx.lineWidth=2.8;ctx.beginPath();ctx.moveTo(33,218);ctx.lineTo(33,200);ctx.quadraticCurveTo(33,192,38,188);ctx.stroke();
  if(s.bottle<bottleMax*.78){line(82,187,73,201,'#e8ffff');line(73,201,81,211,'#e8ffff');line(73,201,64,205,'#d6ffff')}
  if(s.bottle<bottleMax*.4){line(29,218,44,210,'#fff');line(44,210,51,222,'#fff')}
  if(s.jarFlash){ctx.fillStyle='#e0ffff55';ctx.fillRect(25,166,74,73)}ctx.restore();
  rounded(41,167,38,7,2,'#7a633d','#3e3424');rounded(39,173,42,4,1.5,'#b2e7e1','#49727c');
  label(s.bottle,60,160,16,'#fff3b7');
}
function snakeNumbers(entries){
  const placed=[];
  for(const {p,hp,boss} of entries){
    if(p.x<0)continue;
    const size=boss?14:String(hp).length>=4?10.5:12;
    ctx.font='900 '+size+'px "Trebuchet MS","Microsoft YaHei",sans-serif';
    const half=ctx.measureText(String(hp)).width/2+2, height=size/2+1.5;
    const nx=Math.cos(p.angle),ny=-Math.sin(p.angle);
    const distance=boss?31:22;
    let result;
    for(const offset of [0,16,32,48]){
      const x=clamp(p.x+(distance+offset)*nx,half+1,359-half);
      const base=p.y+(distance+offset)*ny;
      for(const shift of [0,-16,16,-32,32]){
        const y=base+shift;
        if(placed.every(r=>Math.abs(r.x-x)>=r.half+half+1||Math.abs(r.y-y)>=r.height+height+1)){
          result={x,y,half,height,hp,size,boss};break;
        }
      }
      if(result)break;
    }
    if(result)placed.push(result);
  }
  return placed;
}
function paintSnake(){
  const s=state,h=pos(s.headDistance);
  const numbers=[{p:h,hp:Math.ceil(s.bossHp),boss:true}];
  for(let i=s.segments.length-1;i>=0;i--){
    const p=linkPose(i);if(p.x < -27)continue;
    const y=p.y+Math.sin(i*1.2+clock*3)*1.1;
    ctx.save();ctx.translate(p.x,y);ctx.rotate(Math.PI/2-p.angle+Math.sin(clock*4+i*.8)*.045);
    ctx.drawImage(i%3===2?sprites.bodyBlue:sprites.body,-23,-18,46,36);ctx.restore();
    if(s.segments[i].flash)ellipse(p.x,y,17,14,'#ffdb964d');
  }
  ctx.save();ctx.translate(h.x,h.y);ctx.rotate(Math.PI/2-h.angle);ctx.drawImage(sprites.head,-31,-25,62,52);
  if(s.freezeT>0){ellipse(0,0,30,26,'#a3f3ff66');ctx.strokeStyle='#c6ffff';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(0,0,31,26,0,0,Math.PI*2);ctx.stroke()}
  if(s.headFlash)ellipse(0,0,23,26,'#ffd3ae40');ctx.restore();
  for(let i=0;i<s.segments.length;i++){
    const p=linkPose(i);if(p.x<0)break;numbers.push({p,hp:s.segments[i].hp});
  }
  for(const n of snakeNumbers(numbers))label(n.hp,n.x,n.y,n.size,n.boss?'#fff1d0':'#fff7e0');
}
function paintGate(){
  const x=state.gate,y=392;
  const g=ctx.createLinearGradient(0,y-11,0,y+9);g.addColorStop(0,'#a7fffa');g.addColorStop(.18,'#6ed1d7');g.addColorStop(1,'#298faa');
  rounded(x-37,y-10,74,19,1,g,'#4b6568',1);line(x-37,y-10,x+37,y-10,'#e2ffff',2);
  label('×2',x,y,15,'#fff9dd','#375c69');
}
function paintPlayer(){
  const s=state,x=s.x;const phase=mode==='playing'?Math.sin(clock*11):Math.sin(clock*3);
  ellipse(x,477,20,4,'#463b3c55');ctx.drawImage(sprites.hero,x-22,434+phase,44,43);
  if(s.released){
    const progress=1-s.releaseT/.85,arc=Math.sin(progress*Math.PI)*64;
    const xx=60+(allyX()-60)*progress, yy=200+(445-200)*progress-arc;
    ctx.save();ctx.shadowColor='#67edff';ctx.shadowBlur=7;ctx.drawImage(sprites.ascended,xx-26,yy-25+phase,52,50);ctx.restore();
  }
}
function paintShots(){
  for(const b of state.shots){
    const color=b.ally?'#affaff':state.power>=32?'#ffb878':'#ffe48c';
    const g=ctx.createLinearGradient(0,b.y,0,b.y+13);g.addColorStop(0,color);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(b.x-2,b.y);ctx.lineTo(b.x+2,b.y);ctx.lineTo(b.x-b.vx*.015,b.y+14);ctx.fill();
    ellipse(b.x,b.y,b.ally?4:2.8,b.ally?4:3,color);ellipse(b.x-.6,b.y-.6,1.25,1.25,'#fff');
  }
}
function draw(){
  ctx.setTransform(canvas.width/360,0,0,canvas.height/640,0,0);ctx.save();
  const s=state;if(s.shake)ctx.translate(Math.sin(clock*90)*s.shake,0);
  ctx.drawImage(sprites.scene,0,0,360,640);for(const t of s.tiles)paintTile(t);paintBottle();paintGate();paintSnake();paintPlayer();paintShots();
  for(const p of s.sparks){ctx.globalAlpha=clamp(p.life*4,0,1);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,2,2)}ctx.globalAlpha=1;
  for(const w of s.words){ctx.globalAlpha=Math.min(1,w.life*3);label(w.text,w.x,w.y,13,w.color)}ctx.globalAlpha=1;
  if(mode==='playing'&&s.t<4){const xx=s.x,y=482;line(xx-29,y,xx-11,y,'#fff8cfb5',1.5);line(xx+11,y,xx+29,y,'#fff8cfb5',1.5);label('‹',xx-30,y-1,17);label('›',xx+30,y-1,17)}
  ctx.restore();
}
function resize(){let r=canvas.getBoundingClientRect(),d=Math.min(3,window.devicePixelRatio||1);canvas.width=Math.max(360,Math.round(r.width*d));canvas.height=Math.max(640,Math.round(r.height*d))}
function loop(now){const dt=Math.min(.06,(now-last)/1000||0);last=now;clock+=dt;
  if(mode==='playing'){acc+=dt;while(acc>=1/120&&mode==='playing'){tick(1/120);acc-=1/120}}draw();requestAnimationFrame(loop)}
Promise.all(Object.entries(files).map(([key,url])=>new Promise((ok,bad)=>{let img=new Image();img.onload=()=>{sprites[key]=img;ok()};img.onerror=bad;img.src=url}))).then(()=>{
  el('back').style.backgroundImage='url('+files.scene+')';newGame();ui();resize();window.addEventListener('resize',resize);el('start').disabled=false;requestAnimationFrame(loop)
}).catch(()=>{el('tip').textContent='素材载入失败，请重新打开文件'});
</script></html>
